# Builds the WebAssembly engine and the page (scripts/build-web.mjs) and deploys web/ to GitHub Pages.
#
# The site is static: no server, and GitHub Pages cannot set the headers that give a page SharedArrayBuffer, so the engine
# uses a pool of Web Workers (no WebAssembly threads) and WebGPU through wgpu (see docs/web-plan.html, web/README.md).
#
# Runs on each release: release-please.yml calls it once it has published a GitHub Release (a release made with the
# GITHUB_TOKEN triggers no `release` event, hence the call). By hand: Actions > pages > Run workflow.
#
# Setup once, in the repository's settings: Pages > Build and deployment > Source: GitHub Actions.
name: pages

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer run replaces one that has not finished.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      # Toolchains, the engine test and the build: shared with ci.yml.
      - uses: ./.github/actions/build-site

      - name: Keep GitHub Pages from running Jekyll over the site
        run: touch web/.nojekyll

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: web

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
